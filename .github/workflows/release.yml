# Builds AI-Offline.zip and attaches it to every published release.
name: Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the ZIP to
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build AI-Offline.zip
        run: |
          mkdir -p dist/AI-Offline
          cp -r "AI Offline.bat" app More LICENSE README.txt dist/AI-Offline/
          cd dist && zip -r -X AI-Offline.zip AI-Offline
          unzip -l AI-Offline.zip | tail -n 3
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/AI-Offline.zip --clobber
